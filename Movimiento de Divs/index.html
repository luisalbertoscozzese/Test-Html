<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Div arrastrable en matriz 3x3</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.0/jquery-ui.min.js"></script>
</head>
<body>
  <div class="contenedor">
    <div class="miDiv">
      Este div se puede mover solo a posiciones predefinidas
    </div>
    <div class="snap" data-row="1" data-col="1"></div>
    <div class="snap" data-row="1" data-col="2"></div>
    <div class="snap" data-row="1" data-col="3"></div>
    <div class="snap" data-row="2" data-col="1"></div>
    <div class="snap" data-row="2" data-col="2"></div>
    <div class="snap" data-row="2" data-col="3"></div>
    <div class="snap" data-row="3" data-col="1"></div>
    <div class="snap" data-row="3" data-col="2"></div>
    <div class="snap" data-row="3" data-col="3"></div>
  </div>

  <script src="js/funtions.js"></script>
</body>
</html>
